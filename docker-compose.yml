# One command to run everything:  docker compose up --build
# Then open http://localhost:3000 — or http://<this computer's IP>:3000 from another machine on
# your network (set AITC_ACCESS_CODE in .env first). Only the web app is reachable from the network;
# the database and API listen on this computer alone.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aitc
      POSTGRES_PASSWORD: aitc
      POSTGRES_DB: aitc
    # No host port: only the API talks to it, so a PostgreSQL already installed on this computer
    # can't clash with it. For native development, `make infra` publishes it on localhost:5432.
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitc"]
      interval: 3s
      retries: 20

  api:
    build: ./apps/api
    restart: unless-stopped  # e.g. if it starts before the network is fully up
    environment:
      AITC_ENV: development
      AITC_DATABASE_URL: postgresql+psycopg://aitc:aitc@postgres:5432/aitc
      AITC_DEV_AUTH_ENABLED: "true"
      AITC_SEED: "true"  # demo users, project and tickets on first start
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}  # read access, to check new projects' repositories
    ports: ["127.0.0.1:8000:8000"]  # API docs at http://localhost:8000/docs on this computer
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      AITC_ACCESS_CODE: ${AITC_ACCESS_CODE:-}  # shared code people on your network must enter
    ports: ["3000:3000"]  # the one port open to your network
    depends_on: [api]

  worker:
    # Runs the AI team: Gemini (BA), Claude Code (developer), Codex (QA), OpenCode + Ollama (junior),
    # and opens draft pull requests for GitHub Copilot to review.
    # Keys come from .env — see .env.example. Members without keys simply stay offline.
    build: ./apps/worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      AITC_API_URL: http://api:8000
      AITC_PROJECTS: ${AITC_PROJECTS:-PORTAL}  # the projects the team works on
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts: ["host.docker.internal:host-gateway"]  # reach Ollama on your computer
    volumes:
      - workspace:/workspace
      # Codex sign-in with your ChatGPT plan lives here:
      #   docker compose run --rm worker codex login --device-auth
      - codex-home:/home/node/.codex
      # OpenCode downloads its model adapter on first use; keep it between restarts.
      - opencode-cache:/home/node/.cache/opencode
    depends_on: [api]

  redis:
    # Reserved for the Celery job service (next stage); not started by default.
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    profiles: ["jobs"]

volumes:
  pgdata:
  workspace:
  codex-home:
  opencode-cache:
