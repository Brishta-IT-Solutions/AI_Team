name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aitc
          POSTGRES_PASSWORD: aitc
          POSTGRES_DB: aitc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aitc" --health-interval 5s --health-retries 10
    env:
      AITC_ENV: test
      AITC_DATABASE_URL: postgresql+psycopg://aitc:aitc@localhost:5432/aitc_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv --python 3.11 && uv pip install -p .venv -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Migrations apply, reverse and match the models
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
      - name: Tests
        run: .venv/bin/python -m pytest

  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aitc
          POSTGRES_PASSWORD: aitc
          POSTGRES_DB: aitc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aitc" --health-interval 5s --health-retries 10
    env:
      AITC_ENV: test
      AITC_DATABASE_URL: postgresql+psycopg://aitc:aitc@localhost:5432/aitc_test
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv venv .venv --python 3.11 && uv pip install -p .venv -e ".[dev]" -e ../api uvicorn
      - name: Lint
        run: .venv/bin/ruff check .
      - name: End-to-end team loop (real API, worker and git; stand-in AI CLIs)
        run: .venv/bin/python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
